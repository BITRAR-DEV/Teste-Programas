<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Ecos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="text">
                <h1>Olá, Seja Bem Vindo!</h1>

            </div>
            <button class="botoes" id="btnAbrir">Escanear</button>
        </div>

    <dialog id="cameraDialog">

            <h2>Escaneando...</h2>
    
            <div class="camera">

            </div>
    
            <button class="botoes" id="btnFechar">Fechar</button>
        </div>
    </dialog>
    <script src="/static/script.js"></script>

</html>
